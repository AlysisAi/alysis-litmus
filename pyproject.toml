[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alysis-litmus"
version = "0.1.0"
description = "Scan code models for fetch-and-execute backdoors."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
alysis-litmus = "litmus:main"

[tool.setuptools]
py-modules = ["litmus"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
